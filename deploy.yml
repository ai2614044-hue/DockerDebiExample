# .github/workflows/deploy.yml
# ─────────────────────────────────────────────────────────────────────────────
# FaceLock CI/CD Pipeline
#
# Triggers
# ────────
#   push to main     → full test + build + deploy
#   pull_request     → lint + test only (no deploy)
#
# Required GitHub Secrets
# ───────────────────────
#   DOCKER_HUB_USERNAME   – Docker Hub username
#   DOCKER_HUB_TOKEN      – Docker Hub access token
#   RENDER_API_KEY        – Render.com API key  (or swap for Railway/EC2)
#   RENDER_SERVICE_ID     – Render service ID to trigger deploy
#   MONGO_URI             – Production MongoDB connection string
# ─────────────────────────────────────────────────────────────────────────────

name: CI / CD – FaceLock

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/facelock-backend

jobs:
  # ── 1. Lint & Test ────────────────────────────────────────────────────────
  test:
    name: Lint & Unit Test
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install OS deps (dlib / OpenCV)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libopenblas-dev liblapack-dev \
            libgl1-mesa-glx libglib2.0-0

      - name: Install Python deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint with Ruff
        working-directory: backend
        run: |
          pip install ruff
          ruff check .

      - name: Run tests
        working-directory: backend
        env:
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB:  facelock_test
        run: |
          pip install pytest pytest-asyncio httpx
          pytest tests/ -v --tb=short || true   # non-fatal until tests are written

  # ── 2. Build & Push Docker Image ─────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context:    ./backend
          file:       ./backend/Dockerfile
          push:       true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          platforms:  linux/amd64,linux/arm64

  # ── 3. Deploy to Render ───────────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy
        run: |
          curl -sf -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'

      - name: Notify success
        run: echo "✅ Deployment triggered for commit ${{ github.sha }}"
